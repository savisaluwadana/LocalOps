version: '3.8'

services:
  # ============================================
  # Kong Database
  # ============================================
  kong-database:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - api-management
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Kong Migrations (Init)
  # ============================================
  kong-migration:
    image: kong:latest
    command: "kong migrations bootstrap"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - api-management

  # ============================================
  # Kong Gateway
  # ============================================
  kong:
    image: kong:latest
    restart: always
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8444:8444"
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    networks:
      - api-management

  # ============================================
  # Konga (UI Dashboard)
  # ============================================
  konga:
    image: pantsel/konga
    ports:
      - "1337:1337"
    environment:
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga_db
      NODE_ENV: production
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - api-management

  # ============================================
  # Upstream Service (Mock)
  # ============================================
  products-api:
    image: fake-service/fake-service:latest
    environment:
      MESSAGE: "Hello from Products API v1"
      SERVER_NAME: "Products API"
    networks:
      - api-management

networks:
  api-management:
    driver: bridge

volumes:
  kong_data:
