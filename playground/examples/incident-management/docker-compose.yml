version: '3.8'

services:
  # ============================================
  # Mock PagerDuty (Simulated API)
  # ============================================
  pagerduty-mock:
    image: fake-service/fake-service:latest
    environment:
      MESSAGE: '{"status":"active","incidents":[]}'
      SERVER_NAME: "PagerDuty API"
    ports:
      - "8081:80"
    networks:
      - incident-net

  # ============================================
  # Incident Bot
  # ============================================
  incident-bot:
    image: fake-service/fake-service:latest
    environment:
      MESSAGE: "Incident Bot Active. Monitoring channels..."
      SERVER_NAME: "Slack Bot"
      UPSTREAM_URIS: "http://pagerduty-mock:80"
    networks:
      - incident-net

networks:
  incident-net:
    driver: bridge
